{% extends "warehouse/base.html" %}
{% block title %}Пристрої{% endblock %}
{% block content %}
<h1 class="h3 mb-3">IoT-пристрої</h1>
<table class="table">
  <thead><tr><th>Код</th><th>Назва</th><th>Тип</th><th>Місце встановлення</th></tr></thead>
  <tbody>
  {% for d in devices %}
  <tr><td>{{ d.code }}</td><td>{{ d.name }}</td><td>{{ d.get_device_type_display }}</td><td>{{ d.location }}</td></tr>
  {% empty %}
  <tr><td colspan="4" class="text-muted">Пристроїв немає</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
