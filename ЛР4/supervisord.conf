[unix_http_server]
file = /tmp/wms4_supervisor.sock

[supervisord]
logfile = /tmp/wms4/logs/supervisord.log
pidfile = /tmp/wms4_supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/wms4_supervisor.sock

[program:djangoproject]
directory = /tmp/wms4
command = /tmp/wms4/env/bin/uwsgi --ini uwsgi.ini
autostart = true
autorestart = true
stopsignal = QUIT
redirect_stderr = true
stdout_logfile = /tmp/wms4/logs/uwsgi.log
