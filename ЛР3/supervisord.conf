[unix_http_server]
file = /tmp/wms3_supervisor.sock

[supervisord]
logfile = /tmp/wms3/logs/supervisord.log
pidfile = /tmp/wms3_supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///tmp/wms3_supervisor.sock

[program:djangoproject]
directory = /tmp/wms3
command = /tmp/wms3/env/bin/uwsgi --ini uwsgi.ini
autostart = true
autorestart = true
stopsignal = QUIT
redirect_stderr = true
stdout_logfile = /tmp/wms3/logs/uwsgi.log
