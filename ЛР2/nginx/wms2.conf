upstream django {
    server unix:/tmp/wms2_uwsgi.sock;
}

server {
    listen      9000;
    server_name localhost djangoproject;
    charset     utf-8;

    location /static/ {
        alias /tmp/wms2_static/;
    }

    location / {
        uwsgi_pass  django;
        include     uwsgi_params;
    }
}
